services:
  - type: web
    name: khabar-backend
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: khabar-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: khabar-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: worker
    name: khabar-worker
    runtime: docker
    rootDir: backend
    dockerCommand: celery -A tasks.pipeline worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: khabar-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: khabar-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: khabar-backend
          envVarKey: JWT_SECRET_KEY
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: cron
    name: khabar-pipeline
    runtime: docker
    rootDir: backend
    schedule: "*/30 * * * *"
    dockerCommand: python -c "from tasks.pipeline import execute_pipeline; execute_pipeline()"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: khabar-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: khabar-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        fromService:
          type: web
          name: khabar-backend
          envVarKey: JWT_SECRET_KEY
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: keyvalue
    name: khabar-redis
    ipAllowList: []

databases:
  - name: khabar-postgres
    databaseName: newsdash
    user: khabar
